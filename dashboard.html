<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app dashboard-app">

    <header class="dashboard-header">

        <div>
            <p class="small-text">Welcome back 👋</p>
            <h1>My Tasks</h1>
        </div>

        <a href="profile.html" class="profile-icon">
            👤
        </a>

    </header>

    <section class="task-summary">

        <div class="summary-card">
            <span>📋</span>

            <div>
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>
        </div>

        <div class="summary-card">
            <span>✅</span>

            <div>
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>
        </div>

    </section>

    <button
        class="add-task-btn"
        onclick="window.location.href='add-task.html'">

        + Add New Task

    </button>

    <div class="task-tabs">

        <button
            id="activeTab"
            class="task-tab active"
            onclick="showActiveTasks()">

            Active Tasks

        </button>

        <button
            id="completedTab"
            class="task-tab"
            onclick="showCompletedTasks()">

            Completed Tasks

        </button>

    </div>

    <section class="task-section">

        <div id="taskList"></div>

    </section>

    <nav class="bottom-nav">

        <a href="dashboard.html" class="nav-item active">
            🏠
            <span>Home</span>
        </a>

        <a href="add-task.html" class="nav-item">
            ➕
            <span>Add</span>
        </a>

        <a href="profile.html" class="nav-item">
            👤
            <span>Profile</span>
        </a>

    </nav>

</div>

<script src="js/script.js"></script>

</body>
</html>
