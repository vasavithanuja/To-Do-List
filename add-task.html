<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Add Task</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <div class="form-page">

        <div class="page-header">
            <a href="dashboard.html" class="back-button">←</a>
            <h1>Add New Task</h1>
        </div>

        <p class="form-subtitle">
            Add a new task to your list
        </p>

        <form id="addTaskForm">

            <label for="taskTitle">
                Task Title
            </label>

            <input
                type="text"
                id="taskTitle"
                placeholder="Enter your task"
                required
            >

            <label for="taskDescription">
                Description
            </label>

            <textarea
                id="taskDescription"
                placeholder="Enter task description"
                rows="4"></textarea>

            <label for="taskDate">
                Due Date
            </label>

            <input
                type="date"
                id="taskDate"
                required
            >

            <label for="taskPriority">
                Priority
            </label>

            <select id="taskPriority">

                <option value="Low">Low</option>

                <option value="Medium" selected>
                    Medium
                </option>

                <option value="High">High</option>

            </select>

            <button type="submit">
                Add Task
            </button>

        </form>

        <a href="dashboard.html" class="back-home">
            Cancel
        </a>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
