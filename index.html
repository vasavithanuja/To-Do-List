<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app home-app">

        <!-- Decorative shapes -->
        <div class="shape shape-top"></div>
        <div class="shape shape-bottom"></div>

        <!-- Logo -->
        <div class="logo-box">
            <div class="logo-circle">
                <div class="clipboard">
                    <div class="clip"></div>

                    <div class="check-row">
                        <span>✓</span>
                        <div></div>
                    </div>

                    <div class="check-row">
                        <span>✓</span>
                        <div></div>
                    </div>

                    <div class="check-row">
                        <span>✓</span>
                        <div></div>
                    </div>
                </div>

                <div class="logo-swoosh"></div>
            </div>
        </div>

        <!-- App Name -->
        <div class="brand">
            <h1>
                <span>Task</span><b>Flow</b>
            </h1>

            <p>Stay organized, stay productive.</p>
        </div>

        <!-- Buttons -->
        <div class="login-register-buttons">

            <button
                class="login-button"
                onclick="window.location.href='login.html'">

                <span class="button-icon">♙</span>
                <span>Login</span>

            </button>

            <button
                class="register-button"
                onclick="window.location.href='register.html'">

                <span class="button-icon">♙+</span>
                <span>Register</span>

            </button>

        </div>

    </div>

</body>
</html>
